[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinpoint"
version = "0.1.0"
description = "Pinpoint: a CV-aimed balloon-popping turret."
readme = "README.md"
requires-python = ">=3.11"
# Libraries the code needs at runtime. Add new ones here (e.g. a YOLO runtime).
dependencies = [
    "numpy",
    "opencv-python",
]

[project.optional-dependencies]
# Developer-only tools, installed with: pip install -e ".[dev]"
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ and benchmarks/ are plain scripts, not part of the package, but
# tests may import from them, so put them on the import path.
pythonpath = ["scripts", "benchmarks"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]
